<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡單位轉換器</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 300px; margin: 0 auto; }
        input, select { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        h2 { color: #1d1d1f; }
    </style>
</head>
<body>
    <div class="card">
        <h2>公斤 🔄 磅 轉換器</h2>
        <input type="number" id="inputVal" placeholder="輸入數值" oninput="convert()">
        <select id="type" onchange="convert()">
            <option value="kgToLb">公斤 轉 磅 (Kg to Lb)</option>
            <option value="lbToKg">磅 轉 公斤 (Lb to Kg)</option>
        </select>
        <h3 id="result">結果：0</h3>
    </div>

    <script>
        function convert() {
            let val = parseFloat(document.getElementById('inputVal').value) || 0;
            let type = document.getElementById('type').value;
            let result = 0;
            
            if (type === "kgToLb") {
                result = val * 2.20462;
                document.getElementById('result').innerText = "結果：" + result.toFixed(2) + " 磅";
            } else {
                result = val / 2.20462;
                document.getElementById('result').innerText = "結果：" + result.toFixed(2) + " 公斤";
            }
        }
    </script>
</body>
</html>
